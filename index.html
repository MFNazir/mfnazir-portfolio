<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhammad Nazir Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* VOICE work, precise and quiet: a product-engineering site (after Paco Coursey's cmdk and Linear's changelog pages)
   IDEA a command menu: visitors type or pick who they are, and the whole site is driven from one palette (Cmd/Ctrl+K)
   PICTURE the open palette itself, large and centred, with results, groups and key hints; behind it, a faint ruled grid
   COLOUR near-black #0c0c0d ground, off-white ink, one signal orange #ff5b1f for the selected row and key figures; light mode is white with the same orange
   TYPE Geist 600 + Geist, Geist Mono for key hints, dates and tags
   LAYOUT gate: palette centred in the first screen; views: narrow 760px reading column with a sticky top row of kbd hints; phone: palette full width */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c0c0d);--panel:light-dark(#fbfbfa,#141416);--ink:light-dark(#121214,#ededee);--mute:light-dark(#6b6b72,#8d8d96);--line:light-dark(#e8e8ea,#232327);--hi:light-dark(#f1f1f2,#1d1d21);--ac:#ff5b1f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 Geist,Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;line-height:1.12;font-weight:600}
p{margin:0}a{color:inherit}
.mono,kbd,.tag,.when,.yr{font-family:"Geist Mono",ui-monospace,monospace}
kbd{font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--mute)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid-bg{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);opacity:.6}
/* gate */
.gate{min-height:100svh;display:grid;place-items:center;padding:40px 16px}
.gwrap{width:min(680px,100%)}
.gname{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.gname h1{font-size:clamp(28px,4.4vw,44px)}
.gname span{color:var(--mute);font-size:14px}
.pal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.55);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal input{flex:1;height:58px;border:0;background:transparent;color:var(--ink);font:500 17px Geist,sans-serif;outline:none}
.pal .grp{font:12px "Geist Mono",monospace;color:var(--mute);padding:12px 18px 6px}
.pal ul{list-style:none;margin:0;padding:0 8px 8px}
.pal li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 10px;border-radius:9px;cursor:pointer}
.pal li[aria-selected=true]{background:var(--hi)}
.pal li[aria-selected=true] .k{color:var(--ac)}
.pal li .k{font-size:18px;color:var(--mute);text-align:center}
.pal li b{display:block;font-weight:600}.pal li small{display:block;color:var(--mute);font-size:13px}
.pal .foot{display:flex;gap:16px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);flex-wrap:wrap}
.pal .empty{padding:18px;color:var(--mute)}
.garc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.garc div{font-size:13px;color:var(--mute)}.garc b{display:block;color:var(--ink);font-size:14px;font-weight:600}
/* overlay palette */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(6px);display:grid;place-items:start center;padding:12vh 16px}
.ov .pal{width:min(620px,100%)}
/* views */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top div{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top a{text-decoration:none;font-weight:600}
.top button{all:unset;margin-left:auto;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--mute);font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;min-height:32px}
.col{max-width:760px;margin:0 auto;padding:48px 16px 80px}
.col>section{padding:36px 0;border-top:1px solid var(--line)}
.col>section:first-child{border-top:0;padding-top:0}
.col h1{font-size:clamp(30px,4.6vw,46px)}
.col h2{font-size:20px;margin-bottom:16px}
.lede{color:var(--mute);margin-top:12px;font-size:17px;max-width:58ch}
.track{position:relative;padding-bottom:22px}.lane{position:relative;height:28px;margin-bottom:5px}
.seg{position:absolute;top:0;bottom:0;border-radius:6px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;padding:0 8px;font-size:12px;white-space:nowrap;overflow:hidden}
.seg.s1{border-color:var(--ac);color:var(--ac)}.seg.s2{border-left:0;background:linear-gradient(90deg,transparent,var(--panel) 60%)}
.ticks{position:absolute;inset:auto 0 0 0;height:18px;font:11px "Geist Mono",monospace;color:var(--mute)}.ticks span{position:absolute}
.era{margin-bottom:28px}.era-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.era-h h3{font-size:16px}.when{font-size:12px;color:var(--mute)}
.card{padding:14px 0;border-bottom:1px dashed var(--line)}
.card h4{font-size:15px}.card p{color:var(--mute);font-size:14.5px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.stack{margin:0}.stack div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.stack dt{font-weight:600}.stack dd{margin:0;color:var(--mute)}
.stds{display:grid;gap:8px}.std{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}.std span{color:var(--mute)}
.list{margin:0;padding-left:18px}.list li{margin:4px 0}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.titles{list-style:none;margin:0;padding:0}.titles li{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.yr{font-size:13px;color:var(--ac)}.titles b{display:block;font-weight:600}.titles div span{color:var(--mute);font-size:14px}
.btn{font:600 14px Geist;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
.copied{margin-left:10px;font-size:13px;color:var(--mute)}.ptxt{margin-top:10px;font-size:14px;color:var(--mute)}
.contact{margin:0;display:grid;gap:6px}.contact div{display:grid;grid-template-columns:90px minmax(0,1fr)}.contact dt{color:var(--mute)}.contact dd{margin:0}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:24px}
.fig{background:var(--bg);padding:18px;display:grid;gap:4px}.fig .was{font:12px "Geist Mono",monospace;color:var(--mute)}
.fig .n{font:600 clamp(30px,4vw,40px)/1 Geist;letter-spacing:-.03em;color:var(--ac);white-space:nowrap}.fig .l{font-size:13.5px;color:var(--mute)}
.caught .row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.caught i{width:8px;height:8px;border-radius:2px;background:var(--ac);margin-top:8px}.caught b{display:block;font-weight:600}.caught span{color:var(--mute);font-size:14px}.caught em{font:normal 12px "Geist Mono",monospace;color:var(--mute)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);padding:10px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);font:500 13px "Geist Mono",monospace;color:var(--ac);grid-row:span 2}.steps b{font-weight:600}.steps span{color:var(--mute);font-size:14px}
.value{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.val b{font-weight:600}.val p{color:var(--mute);font-size:14px;margin-top:4px}
[hidden]{display:none!important}
@media(max-width:640px){.garc,.duo,.value{grid-template-columns:minmax(0,1fr)}.stack div,.std{grid-template-columns:minmax(0,1fr);gap:2px}.pal li{grid-template-columns:24px minmax(0,1fr)}.pal li kbd{display:none}.caught .row{grid-template-columns:8px minmax(0,1fr)}.caught em{grid-column:2}}
</style>
</head>

 {g:'Who are you?',k:'›',t:'Product or business lead',s:'Outcomes and risks caught before launch',key:'B',run:()=>location.hash='business'},
 {g:'Actions',k:'@',t:'Copy email address',s:D.email,key:'C',run:async(el)=>{try{await navigator.clipboard.writeText(D.email);el.querySelector('small').textContent='Copied'}catch(e){el.querySelector('small').textContent=D.email+' (copy blocked)'}}},
 {g:'Actions',k:'↗',t:'Send an email',s:'Opens your mail app',key:'M',run:()=>{location.href='mailto:'+D.email}},
 {g:'Actions',k:'⌂',t:'Back to start',s:'Choose a different view',key:'H',run:()=>location.hash=''}];
function palette(host,auto){
 let q='',sel=0;
 host.innerHTML=`<div class="pal" role="dialog" aria-label="Command menu"><div class="in"><span class="mono" style="color:var(--mute)">⌘</span><input id="${host.id}-q" aria-label="Search" placeholder="I'm a… (type engineer, recruiter, business)" autocomplete="off"></div><div class="res"></div><div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div>`;
 const inp=host.querySelector('input'),res=host.querySelector('.res');
 const list=()=>cmds.filter(c=>(c.t+' '+c.s).toLowerCase().includes(q.toLowerCase()));
 const draw=()=>{const L=list();sel=Math.min(sel,Math.max(L.length-1,0));let g='',h='';L.forEach((c,i)=>{if(c.g!==g){if(g)h+='</ul>';g=c.g;h+=`<div class="grp">${g}</div><ul role="listbox">`}h+=`<li role="option" data-i="${i}" aria-selected="${i===sel}"><span class="k">${c.k}</span><div><b>${c.t}</b><small>${c.s}</small></div><kbd>${c.key}</kbd></li>`});res.innerHTML=L.length?h+'</ul>':'<div class="empty">No match. Try "engineer".</div>';
  res.querySelectorAll('li').forEach(li=>{li.addEventListener('mousemove',()=>{if(sel!=li.dataset.i){sel=+li.dataset.i;draw()}});li.addEventListener('click',()=>L[li.dataset.i].run(li))})};
 inp.addEventListener('input',()=>{q=inp.value;sel=0;draw()});
 inp.addEventListener('keydown',e=>{const L=list();if(e.key==='ArrowDown'){sel=(sel+1)%L.length;draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=(sel-1+L.length)%L.length;draw();e.preventDefault()}else if(e.key==='Enter'&&L[sel]){L[sel].run(res.querySelector(`[data-i="${sel}"]`))}else if(e.key==='Escape'){closeOv()}else if(!q&&e.key.length===1&&!e.metaKey&&!e.ctrlKey){const c=cmds.find(c=>c.key.toLowerCase()===e.key.toLowerCase());if(c&&['E','R','B'].includes(c.key)){e.preventDefault();c.run()}}});
 draw();if(auto)setTimeout(()=>inp.focus({preventScroll:true}),30);
}
palette(document.getElementById('palHome'),matchMedia('(pointer:fine)').matches);
document.getElementById('garc').innerHTML=D.arc.map(a=>`<div><b>${a[0]}</b>${a[1]}</div>`).join('');
const ov=document.getElementById('ov');
const openOv=()=>{ov.hidden=false;palette(ov,true)};
function closeOv(){if(!ov.hidden){ov.hidden=true;ov.innerHTML=''}}
ov.addEventListener('click',e=>{if(e.target===ov)closeOv()});
document.getElementById('openK').addEventListener('click',openOv);
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ov.hidden?openOv():closeOv()}});
const V={
 engineer:()=>`<section><h1>Software engineer turned enterprise architect.</h1><p class="lede">AI automation built with an agentic development lifecycle, defended like a blue team. ${D.tag}</p></section><section><h2>Career track</h2>${H.track()}</section><section><h2>Projects</h2>${H.eras()}</section><section><h2>Stack</h2>${H.stack()}</section><section><h2>Standards</h2>${H.stds()}</section>`,
 recruiter:()=>`<section><h1>${D.title}. Blue team focus, 8+ years.</h1><p class="lede">${D.loc}. Currently at ${D.current}.</p><div style="margin-top:18px">${H.pitch()}</div></section><section><h2>Career track</h2>${H.track()}</section><section class="duo"><div><h2>Strong fit for</h2>${H.list(D.fit)}</div><div><h2>Why he stands out</h2>${H.list(D.standout)}</div></section><section><h2>Credentials</h2>${H.list(D.creds)}</section><section><h2>Title progression</h2>${H.titles()}</section><section><h2>Keywords</h2>${H.kw()}</section><section><h2>Contact</h2>${H.contact()}</section>`,
 business:()=>`<section><h1>${D.bizHead}</h1>${H.figs()}</section><section><h2>Caught before production</h2>${H.caught()}</section><section><h2>How I work with leadership</h2>${H.steps()}</section><section><h2>What you get on your team</h2>${H.value()}</section><section><h2>Contact</h2>${H.contact()}</section>`};
H.route(v=>{closeOv();const g=v==='gate';document.getElementById('gate').hidden=!g;document.getElementById('top').hidden=g;const el=document.getElementById('view');el.hidden=g;
 if(g){palette(document.getElementById('palHome'),matchMedia('(pointer:fine)').matches)}else{el.innerHTML=V[v]();document.getElementById('crumb').textContent='/ '+v;H.wire(el)}scrollTo(0,0)});
}
</script>
